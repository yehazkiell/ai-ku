<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-KU · Web Chat</title>
  <style>
    :root { --bg:#0b1020; --panel:#141b33; --accent:#3ad0c4; --me:#2563eb; --text:#e7ecf5; --muted:#8b97b5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--panel); display:flex; align-items:center; gap:10px;
             border-bottom:1px solid #20294a; }
    header h1 { font-size:18px; margin:0; letter-spacing:1px; color:var(--accent); }
    header .sub { color:var(--muted); font-size:12px; }
    .keybar { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .keybar input { background:#0e1530; border:1px solid #2a3563; color:var(--text); border-radius:8px;
                    padding:8px 10px; width:230px; font-size:13px; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
    .msg.user { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
    .msg.bot  { align-self:flex-start; background:var(--panel); border:1px solid #20294a; border-bottom-left-radius:4px; }
    .msg.err  { align-self:center; background:#3a1320; color:#ffb4c4; border:1px solid #5a1d30; font-size:13px; }
    .role { font-size:11px; color:var(--muted); margin:0 4px 4px; }
    footer { padding:14px 18px; background:var(--panel); border-top:1px solid #20294a; display:flex; gap:10px; }
    #input { flex:1; resize:none; background:#0e1530; border:1px solid #2a3563; color:var(--text);
             border-radius:10px; padding:12px; font-size:15px; height:48px; }
    #send { background:var(--accent); color:#04221f; border:none; border-radius:10px; padding:0 22px;
            font-weight:700; cursor:pointer; }
    #send:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AI-KU</h1>
    <span class="sub">Web Chat</span>
    <div class="keybar">
      <input id="apikey" type="password" placeholder="X-API-KEY" autocomplete="off" />
    </div>
  </header>
  <div id="log">
    <div class="msg bot">Hi! I'm AI-KU. Enter your API key (top right), then ask me anything.</div>
  </div>
  <footer>
    <textarea id="input" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </footer>

  <script>
    const logEl = document.getElementById('log');
    const inputEl = document.getElementById('input');
    const sendEl = document.getElementById('send');
    const keyEl = document.getElementById('apikey');
    const history = [];

    keyEl.value = localStorage.getItem('aiku_api_key') || '';
    keyEl.addEventListener('change', () => localStorage.setItem('aiku_api_key', keyEl.value.trim()));

    function add(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    async function send() {
      const message = inputEl.value.trim();
      const key = keyEl.value.trim();
      if (!message) return;
      if (!key) { add('Please enter your X-API-KEY in the top-right field.', 'err'); return; }

      add(message, 'user');
      inputEl.value = '';
      sendEl.disabled = true;
      const pending = add('…', 'bot');

      try {
        const res = await fetch('/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-API-KEY': key },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'success') {
          pending.remove();
          add('Error: ' + (data.message || data.error || JSON.stringify(data.errors || data)), 'err');
        } else {
          pending.textContent = data.response;
          history.push({ role: 'user', content: message });
          history.push({ role: 'assistant', content: data.response });
        }
      } catch (e) {
        pending.remove();
        add('Network error: ' + e.message, 'err');
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
