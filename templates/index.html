<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Ku Ultra - Pro AI Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Markdown, Sanitization, and Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="light-mode">
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <i class="fas fa-plus"></i> Chat Baru
                </button>
            </div>
            <div class="chat-list" id="chat-sessions">
                <!-- Sessions will appear here -->
            </div>
            <div class="sidebar-footer">
                <button onclick="toggleTheme()" class="footer-btn">
                    <i class="fas fa-moon" id="theme-icon"></i> <span class="btn-text">Tema</span>
                </button>
                <button onclick="openPromptLibrary()" class="footer-btn">
                    <i class="fas fa-book"></i> <span class="btn-text">Prompt Lib</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div class="header-left">
                    <button id="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <h1><i class="fas fa-robot"></i> AI-Ku <span class="badge">Ultra</span></h1>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="openTab('chat-tab')">Chat</button>
                    <button class="tab-btn" onclick="openTab('image-tab')">Gambar</button>
                </div>
            </header>

            <div id="chat-tab" class="tab-content active">
                <div class="chat-container">
                    <div class="chat-header-info">
                    <select id="chat-engine" onchange="updateChatUI()">
                        <option value="pollination">Mode Standar (Fast)</option>
                        <option value="ultra">Mode Ultra IQ (Smartest)</option>
                    </select>
                        <select id="chat-model">
                        <option value="openai">OpenAI (Recommended)</option>
                            <option value="mistral">Mistral AI</option>
                            <option value="llama">Meta Llama 3</option>
                        </select>
                        <div class="chat-actions">
                            <button onclick="startSTT()" title="Voice Input"><i class="fas fa-microphone"></i></button>
                            <button onclick="clearCurrentChat()" title="Hapus Chat"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div id="chat-messages" class="chat-box">
                        <!-- Messages -->
                    </div>
                    <div class="input-container">
                        <div class="input-wrapper">
                            <textarea id="chat-input" placeholder="Tanyakan apa saja..." rows="1" onkeydown="handleChatKey(event)"></textarea>
                            <button onclick="sendMessage()" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="image-tab" class="tab-content">
                <div class="image-generator-pro">
                    <div class="settings-panel">
                        <div class="control-group">
                            <label>Model</label>
                            <select id="image-model">
                                <option value="flux">FLUX.1 High-End</option>
                                <option value="flux-realism">Photorealism</option>
                                <option value="any-dark">Cinematic Dark</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Ratio</label>
                            <select id="image-ratio">
                                <option value="1024x1024">1:1 Square</option>
                                <option value="1280x720">16:9 Landscape</option>
                                <option value="720x1280">9:16 Portrait</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-area">
                        <input type="text" id="image-prompt" placeholder="Gambarkan sesuatu yang luar biasa...">
                        <button onclick="generateImage()"><i class="fas fa-magic"></i> Generate</button>
                    </div>
                    <div class="image-display-area">
                        <div id="image-result" class="main-image">
                            <p>Siap untuk membuat karya seni?</p>
                        </div>
                        <div class="image-history-strip" id="image-history">
                            <!-- Recent images -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="prompt-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('prompt-modal')">&times;</span>
            <h2>Library Prompt</h2>
            <div class="prompt-grid">
                <div class="prompt-card" onclick="usePrompt('Jelaskan konsep kuantum fisika seperti saya anak umur 5 tahun.')">
                    <i class="fas fa-lightbulb"></i>
                    <span>Edukasi</span>
                </div>
                <div class="prompt-card" onclick="usePrompt('Bantu saya membuat script Python untuk scraping data berita.')">
                    <i class="fas fa-code"></i>
                    <span>Coding</span>
                </div>
                <div class="prompt-card" onclick="usePrompt('Tuliskan puisi romantis tentang senja di Jakarta.')">
                    <i class="fas fa-pen-nib"></i>
                    <span>Kreatif</span>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
