<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Ku - Chat & Gambar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-robot"></i> AI-Ku</h1>
            <p>Chat LLM & Generate Gambar Gratis</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('chat-tab')">Chat</button>
            <button class="tab-btn" onclick="openTab('image-tab')">Gambar</button>
        </div>

        <div id="chat-tab" class="tab-content active">
            <div id="chat-messages" class="chat-box">
                <div class="message bot">
                    Halo! Saya AI-Ku. Ada yang bisa saya bantu hari ini?
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="chat-input" placeholder="Tulis pesan..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="image-tab" class="tab-content">
            <div class="image-generator">
                <div class="input-area">
                    <input type="text" id="image-prompt" placeholder="Deskripsikan gambar yang ingin dibuat...">
                    <button onclick="generateImage()"><i class="fas fa-magic"></i> Buat</button>
                </div>
                <div id="image-result" class="image-result">
                    <p>Hasil gambar akan muncul di sini</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
